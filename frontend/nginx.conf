server {
  listen 80;
  root /usr/share/nginx/html;

  # The browser only ever talks to this origin; nginx forwards API calls to the api container.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;          # a request can make several LLM calls (agent + reasks)
  }

  location / {
    try_files $uri /index.html;
  }
}
